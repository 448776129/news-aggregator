name: Deploy API to Vercel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" 2>&1 | tee deploy.log

      - name: Smoke test
        run: |
          URL=$(grep -oE 'https://news-aggregator-[a-z0-9-]+\.vercel\.app' deploy.log | tail -1)
          echo "Testing $URL"
          curl -fsS "$URL/health"
          echo
          curl -fsS "$URL/api/dates" | head -c 300
          echo
