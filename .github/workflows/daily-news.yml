name: 新闻抓取与归档（每 3 分钟）

on:
  schedule:
    # UTC 时间，每 5 分钟执行一次（GitHub Actions 定时最小粒度为 5 分钟）
    # 错开到 :03/:08/... 而不是整 5 分钟点，避开整点调度高峰导致的丢跑
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "要归档的日期 YYYY-MM-DD（留空为当天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 3 分钟一轮（由 Cloudflare Worker 触发），单次实测约 20 秒，留足余量。
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并归档
        env:
          JIN10_SECRET_KEY: ${{ secrets.JIN10_SECRET_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
          NEWS_TIMEZONE: Asia/Shanghai
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python run.py fetch --date "$DATE"
          else
            python run.py fetch
          fi

      - name: 提交归档数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有新增数据，跳过提交。"
            exit 0
          fi
          git commit -m "chore: 更新新闻归档 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # 并发触发时远端可能已被别的 run 推进。两个 run 改的是同一批 JSON，
          # rebase 必然冲突，因此失败后重置到远端最新，再用脚本按 id 把自己的
          # 数据合并回来（幂等，不会产生重复条目）。
          for i in 1 2 3 4 5; do
            if git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送被拒（第 $i 次）：改为按 id 合并远端最新数据"
            rm -rf /tmp/mine && cp -r data /tmp/mine
            git fetch origin main
            git reset --hard origin/main
            python scripts/merge_data_files.py /tmp/mine data
            git add data/
            if git diff --cached --quiet; then
              echo "合并后与远端一致，无需提交"
              exit 0
            fi
            git commit -m "chore: 更新新闻归档 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            sleep 3
          done
          echo "多次推送失败，放弃本轮提交"
          exit 1

      - name: 去重体检（不阻断）
        continue-on-error: true
        run: |
          TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          python scripts/check_duplicates.py "$TODAY"
