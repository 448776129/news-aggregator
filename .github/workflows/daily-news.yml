name: 新闻抓取与归档（每 5 分钟）

on:
  schedule:
    # UTC 时间，每 5 分钟执行一次（GitHub Actions 定时最小粒度为 5 分钟）
    # 错开到 :03/:08/... 而不是整 5 分钟点，避开整点调度高峰导致的丢跑
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "要归档的日期 YYYY-MM-DD（留空为当天）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: news-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 定时粒度 5 分钟：单次运行限时 5 分钟，避免任务堆积 overlapping。
    timeout-minutes: 5
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 抓取并归档
        env:
          JIN10_SECRET_KEY: ${{ secrets.JIN10_SECRET_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          XUEQIU_COOKIE: ${{ secrets.XUEQIU_COOKIE }}
          NEWS_TIMEZONE: Asia/Shanghai
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python run.py fetch --date "$DATE"
          else
            python run.py fetch
          fi

      - name: 提交归档数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "没有新增数据，跳过提交。"
          else
            git commit -m "chore: 更新新闻归档 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
